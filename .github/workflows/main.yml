name: Build & Release AOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (example: 1.0.13)"
        required: true

concurrency:
  group: aos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Validate version input
        shell: powershell
        run: |
          if ("${{ github.event.inputs.version }}" -notmatch "^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$") {
            throw "Version must look like 1.2.3 or 1.2.3-beta.1"
          }

      - name: Set version
        shell: powershell
        run: |
          $json = Get-Content package.json | ConvertFrom-Json
          $json.version = "${{ github.event.inputs.version }}"
          $json | ConvertTo-Json -Depth 10 | Set-Content package.json

      - name: Commit version bump
        shell: powershell
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add package.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "release v${{ github.event.inputs.version }}"
            git push
          } else {
            Write-Host "No package.json changes to commit."
          }

      - name: Install dependencies
        run: npm install

      - name: Run smoke checks
        run: npm run smoke

      - name: Build & Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: npm run release:win
